# NetworkManager leaves OpenWeir's TUN device alone (D67): the service configures openweir0, and
# NetworkManager configuring it as well would fight over its addresses, routes and DNS.
# "+=" adds to the list that other files set, such as Ubuntu's 10-globally-managed-devices.conf,
# where "=" would replace it.
[keyfile]
unmanaged-devices+=interface-name:openweir*
