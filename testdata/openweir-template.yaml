# api-edge's OpenWeir template (preset-openweir) as a provider renders it for the app, which asks
# with `OpenWeir/<version> (<platform>) clash.meta` (D48). Source: openweir/api-edge df075d50e7ec,
# resources/subscriptions/openweir.liquid.txt with the built-in routing of
# resources/install/client-routing.json (src/features/proxy/client-routing-render.ts, kind openweir).
# The nodes are placeholders in the shapes node.openweir writes (src/features/proxy/clients.ts),
# one per protocol and variant, on documentation addresses; the origin is provider.example.
# To refresh: render preset-openweir on a site with the built-in routing (the admin preview,
# POST /api/v1/admin/proxy/subscriptions/preview {"params": {"target": "preset-openweir"}}), keep
# it verbatim but for the nodes, their names in the groups and the origin, and replace those with
# placeholders like these.
# The counts are in src/core/internal/engine/openweir_template_test.go and
# tests/e2e/test_openweir_template.py.
# Example Provider
mixed-port: 9347
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ["*.lan", "*.local", "+.msftconnecttest.com", "+.msftncsi.com", "time.*.com", "+.stun.*.*", "localhost.ptlogin2.qq.com"]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  proxy-server-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  nameserver-policy:
    "geosite:geolocation-!cn": [https://dns.cloudflare.com/dns-query, https://dns.google/dns-query]
