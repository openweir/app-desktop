# Publishing a stable release (a draft from release.yml, published by hand) replaces the
# previews of its version from prerelease.yml: remove them with their tags.
name: Remove previews

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  remove:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Remove this version's previews
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"$TAG-preview.\"))) | .tagName" |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
