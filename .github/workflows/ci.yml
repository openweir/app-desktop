name: CI

on:
  push:
    # The last jobs publish: develop as a preview (prerelease.yml), main as a release (release.yml).
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run. Each main run has a
# group of its own: it always runs to the end and waits for no other. In one group, a release
# awaiting approval (release.yml) would hold back every later main push, and an old run
# approved late would draft its stale commit; the release drafts only from main's tip.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default; the jobs that publish name what more they need.
permissions:
  contents: read

env:
  UV_HTTP_RETRIES: "5"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      protocol: ${{ steps.select.outputs.protocol }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The version every build and publication of this run carries, computed once from the
      # full history: the newest vX.Y.Z tag and the conventional commits after it, or
      # pyproject.toml's before the first release (scripts/next_version.py).
      - name: Version from git
        id: version
        run: |
          version=$(python3 scripts/next_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Select checks from the complete change range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_changes.py > "$RUNNER_TEMP/selection.json"
          cat "$RUNNER_TEMP/selection.json"
      # The script cannot vouch for a change to itself. Unless the one that ran is the one at
      # the start of the range (the pull request's base; a push's successful baseline and
      # previous head), every check runs, whatever it selected. Read with the runner's Python.
      # main and develop often point at one commit after a release; main's run covers it,
      # so develop runs no checks and therefore publishes no preview.
      - name: Skip develop when main has the same commit
        id: same
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "main=true" >> "$GITHUB_OUTPUT"
            echo "main is at this commit; its CI run covers it, so develop runs no checks." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Every check when the selection script changed
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SAME_AS_MAIN: ${{ steps.same.outputs.main }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SELECTION: ${{ runner.temp }}/selection.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          # Every job below that the selection names; tests/test_ci_changes.py keeps it whole.
          EVERY = ['apple', 'e2e', 'go', 'installer-ui', 'linux-install', 'linux-package', 'python', 'tun', 'windows-arm64-upgrade', 'windows-installer']
          SCRIPT = 'scripts/ci_changes.py'

          def commit(value):
              return value if re.fullmatch(r'[0-9a-f]{40}', value or '') and value != '0' * 40 else None

          def same_script(base):
              # git diff exits 1 for a difference and 128 for a commit it does not have.
              return base is not None and subprocess.run(
                  ['git', 'diff', '--quiet', '--no-renames', base, 'HEAD', '--', SCRIPT]
              ).returncode == 0

          try:
              with open(os.environ['SELECTION'], encoding='utf-8') as stream:
                  selection = json.load(stream)
              jobs, protocol, base = selection['jobs'], selection['protocol'] is True, selection['base']
          except (OSError, ValueError, KeyError, TypeError):
              selection = None
          event = os.environ['EVENT']
          if selection is None:
              trusted = False
          elif event == 'pull_request':
              trusted = same_script(commit(os.environ['PR_BASE']))
          elif event == 'push':
              before = commit(os.environ['BEFORE'])
              trusted = same_script(commit(base)) and (before is None or same_script(before))
          else:
              trusted = False
          if not trusted:
              jobs, protocol = EVERY, True
          if os.environ.get('SAME_AS_MAIN') == 'true':
              jobs, protocol = [], False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"jobs={json.dumps(sorted(jobs), separators=(',', ':'))}\nprotocol={str(protocol).lower()}\n")
          if not trusted:
              print(f'{SCRIPT} changed in this range, or its selection is unreadable: every check runs')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'\nEvery check runs: `{SCRIPT}` is not the one at the start of the range.\n')
          PY

  python:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'python')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            python_arch: aarch64
          - os: macos-26-intel
            python_arch: x86_64
          - os: windows-latest
            python_arch: x86_64
          - os: windows-11-arm
            python_arch: aarch64
          - os: ubuntu-24.04
            python_arch: x86_64
          - os: ubuntu-24.04-arm
            python_arch: aarch64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
      CGO_ENABLED: ${{ matrix.os == 'windows-11-arm' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # What PySide6's Qt loads from the system (readelf -d: libQt6Gui, the offscreen platform,
      # QtDBus); the fonts are the app's own (src/openweir/ui/fonts), so none are installed.
      # A mirror that fails is retried, and the whole install twice more.
      - name: Qt system libraries
        if: runner.os == 'Linux'
        # The runner images usually have them; a mirror that stops answering once held this
        # step until the job's time ran out, so apt only runs for what is missing, and every
        # call has a deadline.
        timeout-minutes: 15
        run: |
          # fonts-noto-color-emoji: Linux draws emoji with the system's colour font
          # (test_fonts), which the x86_64 image lacks.
          packages=(libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 libx11-6 fonts-noto-color-emoji)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}\n' "$package" 2>/dev/null | grep -qx 'install ok installed' ||
              missing+=("$package")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Qt's system libraries are installed"
            exit 0
          fi
          apt=(sudo timeout 240 apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if "${apt[@]}" update && "${apt[@]}" -y install --no-install-recommends "${missing[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error::apt-get could not install Qt's system libraries: ${missing[*]}"
          exit 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      # pyright runs on Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint and format
        if: matrix.os == 'macos-26'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      # Theme and translation freshness are covered by pytest, once per platform.
      - name: Protocol bindings are current
        if: matrix.os == 'macos-26' && needs.changes.outputs.protocol == 'true'
        run: uv run python scripts/gen_protocol.py --check
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      # The ARM64 build's Nuitka plugin against the function it replaces, under the build's
      # Nuitka (the locked build group) and its own copy of pefile, which it installs only on
      # Windows.
      - name: Nuitka dependency plugin
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          OPENWEIR_NUITKA_TESTS: "1"
        run: uv run --frozen --group build pytest -q tests/test_nuitka_pefile.py

  # The UI against the real development service (docs/architecture.md §11): no TUN, only
  # loopback traffic to local servers through the mixed port.
  e2e:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # As in the python job.
      - name: Qt system libraries
        if: runner.os == 'Linux'
        # The runner images usually have them; a mirror that stops answering once held this
        # step until the job's time ran out, so apt only runs for what is missing, and every
        # call has a deadline.
        timeout-minutes: 15
        run: |
          # fonts-noto-color-emoji: Linux draws emoji with the system's colour font
          # (test_fonts), which the x86_64 image lacks.
          packages=(libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 libx11-6 fonts-noto-color-emoji)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}\n' "$package" 2>/dev/null | grep -qx 'install ok installed' ||
              missing+=("$package")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Qt's system libraries are installed"
            exit 0
          fi
          apt=(sudo timeout 240 apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if "${apt[@]}" update && "${apt[@]}" -y install --no-install-recommends "${missing[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error::apt-get could not install Qt's system libraries: ${missing[*]}"
          exit 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Install (locked)
        run: uv sync --frozen
      # The GEO data the installers ship, for the "my plan" tests; the pin is in the script.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: GEO data and its category list
        run: uv run python scripts/fetch_geodata.py --check
      - name: Build the development service
        run: go -C src/core build -o "$RUNNER_TEMP/openweir-service" ./service
      - name: End-to-end tests
        env:
          QT_QPA_PLATFORM: offscreen
          OPENWEIR_E2E: "1"
          OPENWEIR_E2E_SERVICE: ${{ runner.temp }}/openweir-service
        run: uv run pytest -q tests/e2e

  go:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'go')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, windows-latest, windows-11-arm, ubuntu-latest]
    env:
      CGO_ENABLED: ${{ matrix.os == 'windows-11-arm' && '0' || '1' }}
    defaults:
      run:
        working-directory: src/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Format
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      # A run's logs need a signed-in account, its annotations don't: a failing go test also
      # repeats its failures as error annotations.
      - name: Vet and test
        shell: bash
        run: |
          go vet ./...
          go test ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log" || {
            status=$?
            grep -E '^(--- FAIL|FAIL|panic:)|^[[:space:]]+[[:alnum:]_./-]+_test\.go:[0-9]+:' "$RUNNER_TEMP/go-test.log" |
              head -30 | sed -e 's/%/%25/g' -e 's/^/::error title=go test::/'
            exit "$status"
          }
      - name: Race detector
        # Go 1.27's race runtime supports Windows amd64, not Windows arm64.
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
        shell: bash
        run: |
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/go-race.log" || {
            status=$?
            grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)|^[[:space:]]+[[:alnum:]_./-]+_test\.go:[0-9]+:' "$RUNNER_TEMP/go-race.log" |
              head -30 | sed -e 's/%/%25/g' -e 's/^/::error title=go test -race::/'
            exit "$status"
          }
      - name: Fork outbounds (macOS native Cronet)
        if: runner.os == 'macOS'
        run: go test -race -tags with_gvisor,with_naive -run '^TestFork' ./internal/engine
      - name: Fork outbounds (Windows native Cronet)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = go env GOARCH
          $native = go mod download -json "github.com/sagernet/cronet-go/lib/windows_$arch" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$($native.Dir);$env:PATH"
          $race = @()
          if ($arch -eq 'amd64') { $race += '-race' }
          go test @race -tags with_gvisor,with_naive,with_purego -run '^(TestFork|TestNaiveRuntime)' ./internal/engine ./service
      # Tailscale's outbound only builds with with_gvisor, so the security and mesh tests run
      # once more with it: its state-dir held to the home (docs/mesh.md §4), and the fields
      # its status is read from (§10.1).
      - name: Security and mesh tests with with_gvisor
        if: runner.os == 'Linux'
        run: go test -race -tags with_gvisor -run '^(TestSecurity|TestMesh|TestNetworks)' ./internal/engine
      # The Linux service loads Cronet through purego as the Windows one does, from beside
      # itself (libcronet.so); the tests find it through LD_LIBRARY_PATH instead.
      - name: Fork outbounds (Linux native Cronet)
        if: runner.os == 'Linux'
        run: |
          native=$(go mod download -json "github.com/sagernet/cronet-go/lib/linux_$(go env GOARCH)" | jq -r .Dir)
          LD_LIBRARY_PATH="$native" go test -race -tags with_gvisor,with_naive,with_purego -run '^(TestFork|TestNaiveRuntime)' ./internal/engine ./service
      # Both release services as their packages build them (CGO_ENABLED=0), for both
      # architectures; linux-package builds and runs the native one.
      - name: Windows and Linux service cross-builds
        if: runner.os == 'Linux'
        run: |
          for os in windows linux; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -tags with_gvisor,with_naive,with_purego -o /dev/null ./service
            done
          done
      - name: macOS extension archive
        if: runner.os == 'macOS'
        run: go build -buildmode=c-archive -o "$RUNNER_TEMP/libopenweir.a" ./apple

  # The universal macOS app and system extension (apple/README.md), signed ad hoc;
  # Developer ID signing and notarization belong to the release workflow.
  # Match the app's minimum supported macOS version (D28), as the release job does.
  apple:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'apple')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # The version the changes job computed, into pyproject.toml before anything is built.
      - name: Version
        shell: bash
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: uv run --no-project python scripts/next_version.py --set "$VERSION"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      # The one build tool not pinned: Homebrew installs only its current XcodeGen
      # (docs/maintenance.md §5.4).
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      # The GEO data the extension carries in its resources; the pin is in the script.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: Rosetta for the x64 Python compiler
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      # With the build tools (Nuitka, dmgbuild) from the lock's build group.
      - name: Install (locked)
        run: uv sync --frozen --group build
      # Compile and merge the real UI, Python/Qt libraries, manager and Go/Cronet extension.
      # The builder checks every Mach-O for both slices before ad hoc signing.
      - name: Build universal app (unsigned)
        run: uv run --frozen --group build python scripts/build_app.py --unsigned
      # The release's actual universal app in a disk image.
      - name: Disk image
        run: |
          uv run --frozen --group build python scripts/build_dmg.py \
            build/app/OpenWeir.app "$RUNNER_TEMP/OpenWeir-universal.dmg"

      - name: Retain universal disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-universal-${{ github.sha }}
          path: ${{ runner.temp }}/OpenWeir-universal.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      # The packaged UI starts natively and under Rosetta, opens its window and quits when a
      # second start asks it to, recording no crash. Nothing connects, so the extension is
      # never activated; ad hoc signed, the app could not activate it anyway. The window is
      # looked up by process in CGWindowListCopyWindowInfo, which needs no permission.
      - name: Start the UI on both architectures
        env:
          QT_FORCE_STDERR_LOGGING: "1"  # Qt's messages, a qFatal's reason among them
        run: |
          ui=build/app/OpenWeir.app/Contents/MacOS/OpenWeirUI
          data="$HOME/Library/Application Support/OpenWeir"
          output="$RUNNER_TEMP/openweir-ui"
          mkdir -p "$output"
          cat > "$RUNNER_TEMP/has-window.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation

          // Exits 0 when the process has an ordinary window (layer 0) on screen.
          let pid = Int(CommandLine.arguments[1])!
          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] ?? []
          exit(windows.contains {
            $0[kCGWindowOwnerPID as String] as? Int == pid && $0[kCGWindowLayer as String] as? Int == 0
          } ? 0 : 1)
          SWIFT
          xcrun swiftc -O -o "$RUNNER_TEMP/has-window" "$RUNNER_TEMP/has-window.swift"

          # A child that has exited stays a zombie until waited for.
          alive() { [[ "$(ps -o stat= -p "$1" 2> /dev/null)" =~ ^[^Z] ]]; }
          fail() {
            echo "::error::$1"
            [[ -d "$data/crashes" ]] && cp -R "$data/crashes" "$output/"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'OpenWeirUI*' -exec cp {} "$output/" \; 2> /dev/null || true
            for log in "$output"/*.err "$output"/crashes/ui-*.log; do
              [[ -s "$log" ]] || continue
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            done
            exit 1
          }
          for arch in arm64 x86_64; do
            arch "-$arch" "$ui" > "$output/$arch.out" 2> "$output/$arch.err" &
            pid=$!
            for _ in $(seq 180); do
              alive "$pid" || break
              "$RUNNER_TEMP/has-window" "$pid" && break
              sleep 1
            done
            if ! alive "$pid"; then
              status=0
              wait "$pid" || status=$?
              fail "The $arch UI exited with $status while starting"
            fi
            if ! "$RUNNER_TEMP/has-window" "$pid"; then
              kill "$pid" 2> /dev/null || true
              fail "The $arch UI opened no window in 180 seconds"
            fi
            echo "The $arch UI ($pid) opened its window"
            if ! "$ui" --quit; then
              kill "$pid" 2> /dev/null || true
              fail "OpenWeirUI --quit did not reach the $arch UI"
            fi
            for _ in $(seq 30); do
              alive "$pid" || break
              sleep 1
            done
            if alive "$pid"; then
              kill "$pid" 2> /dev/null || true
              fail "The $arch UI did not quit within 30 seconds of --quit"
            fi
            status=0
            wait "$pid" || status=$?
            [[ "$status" -eq 0 ]] || fail "The $arch UI exited with $status after --quit"
            # faulthandler's log of a clean exit is empty and removed; any other is a crash.
            if compgen -G "$data/crashes/ui-*.log" > /dev/null; then
              fail "The $arch UI recorded a crash or an unhandled exception"
            fi
          done

      - name: Keep the UI's output and crash logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-ui-${{ github.sha }}
          path: ${{ runner.temp }}/openweir-ui/
          if-no-files-found: ignore
          retention-days: 14

  installer-ui:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'installer-ui')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python_arch: x86_64
          - os: windows-11-arm
            arch: arm64
            python_arch: aarch64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify custom install directory security
        shell: powershell
        run: ./package/windows/path-smoke-test.ps1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: NSIS
        run: ./package/windows/install-nsis.ps1
      - name: Build the custom Win32 surface and read-only harness
        run: uv run --frozen python scripts/build_installer_ui.py --preview --arch ${{ matrix.arch }}
      - name: Exercise installer UI and capture screenshots
        shell: powershell
        run: ./package/windows/ui-smoke-test.ps1 -Preview build/installer-ui/OpenWeir-setup-preview.exe -Output build/installer-ui/screenshots -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: installer-ui-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/installer-ui/screenshots/
            build/installer-ui/OpenWeirSetupUI.dll
            build/installer-ui/OpenWeirSetupUI.pdb
            build/installer-ui/OpenWeir-setup-preview.exe
          if-no-files-found: ignore
          retention-days: 14

  # The unsigned Windows installer (docs/architecture.md §9, §10), then installed, upgraded and
  # uninstalled on the runner by package/windows/smoke-test.ps1: the service starts and listens
  # on its pipe, the UI opens its window. No TUN, no connection.
  windows-installer:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-installer')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python_arch: x86_64
            build: build/windows
          - os: windows-11-arm
            arch: arm64
            python_arch: aarch64
            build: build/windows-arm64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
      NUITKA_CACHE_DIR: ${{ github.workspace }}\build\nuitka-cache-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # The version the changes job computed, into pyproject.toml before anything is built.
      - name: Version
        shell: bash
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: uv run --no-project python scripts/next_version.py --set "$VERSION"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: NSIS
        run: ./package/windows/install-nsis.ps1
      # With the build tools (Nuitka) from the lock's build group.
      - name: Install (locked)
        run: uv sync --frozen --group build
      - name: Installer cleanup regression
        run: uv run --frozen pytest -q tests/test_build_windows.py -k "removal_routine or readonly_owned_files or locked_old_extension"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      # Nuitka's compiled C: most of it is the dependencies', which change with the lock.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/nuitka-cache-${{ matrix.arch }}
          key: nuitka-windows-${{ matrix.arch }}-${{ hashFiles('uv.lock', 'scripts/build_windows.py', 'package/windows/nuitka_pefile.py') }}
      - name: Build (unsigned)
        run: uv run --frozen --group build python scripts/build_windows.py --arch ${{ matrix.arch }}
      - name: Install, upgrade and uninstall
        shell: powershell
        run: ./package/windows/smoke-test.ps1 -Installer (Get-Item ${{ matrix.build }}/OpenWeir-*-windows-${{ matrix.arch }}-setup.exe).FullName
      # The UI's output from each start, and the crash directory of one that died starting.
      - name: Keep the UI's output and crash logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-ui-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/openweir-ui/
          if-no-files-found: ignore
          retention-days: 14
      # Kept as long as the disk image, so that a rerun of the preview job still finds them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-installer-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ matrix.build }}/OpenWeir-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-arm64-upgrade:
    needs: [changes, windows-installer]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-arm64-upgrade')
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-installer-x64-${{ github.sha }}
          path: build/migration/x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-installer-arm64-${{ github.sha }}
          path: build/migration/arm64
      - name: Upgrade an emulated x64 installation to native ARM64
        shell: powershell
        run: ./package/windows/arm64-upgrade-smoke-test.ps1 -X64Installer (Get-Item build/migration/x64/*.exe).FullName -ARM64Installer (Get-Item build/migration/arm64/*.exe).FullName

  # The unsigned Linux packages (package/linux/README.md, D61): the .deb and .rpm of each
  # architecture, built where their glibc floor is: x64 in an ubuntu:22.04 container (glibc
  # 2.35), arm64 on the Ubuntu 24.04 runner itself (2.39, PySide6's aarch64 floor). The next
  # version's .deb, packaged from the same tree, is for linux-install's upgrade. A failed build
  # names what failed in error annotations (scripts/build_linux.py), as the tests do.
  linux-package:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'linux-package')
    runs-on: ${{ matrix.os }}
    # No image (arm64) runs the job on the runner itself.
    container: ${{ matrix.container }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            container: ubuntu:22.04
          - os: ubuntu-24.04-arm
            arch: arm64
            container: ""
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.changes.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # The container has none of them, nor sudo, and runs as root. git before the checkout, so
      # that it is a repository and Go stamps the service with its commit, as elsewhere.
      # Nuitka needs a C compiler and patchelf, build_linux.py readelf and objcopy, its tests
      # desktop-file-validate; ccache keeps Nuitka's C between runs.
      - name: Build tools
        timeout-minutes: 15
        run: |
          sudo=()
          [ "$(id -u)" -eq 0 ] || sudo=(sudo)
          apt=("${sudo[@]}" env DEBIAN_FRONTEND=noninteractive timeout 600 apt-get -q -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if "${apt[@]}" update && "${apt[@]}" install --no-install-recommends \
              git ca-certificates build-essential patchelf binutils desktop-file-utils ccache zstd; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error title=Build tools::apt-get could not install the build tools"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # The version the changes job computed, into pyproject.toml before anything is built.
      - name: Version
        run: uv run --no-project python scripts/next_version.py --set "$VERSION"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      # The libraries the packages take from the distribution (package/linux/
      # system-libraries.toml), so that Nuitka and readelf's checks find what Qt needs. Of
      # "a | b" the first this distribution has.
      - name: System libraries
        timeout-minutes: 15
        run: |
          mapfile -t wanted < <(uv run --no-project python -c 'import tomllib; print("\n".join(library["deb"] for library in tomllib.load(open("package/linux/system-libraries.toml", "rb"))["library"]))')
          [ "${#wanted[@]}" -gt 0 ] || { echo "::error title=System libraries::system-libraries.toml lists nothing"; exit 1; }
          packages=()
          for entry in "${wanted[@]}"; do
            chosen=
            IFS='|' read -ra alternatives <<< "$entry"
            for name in "${alternatives[@]}"; do
              name=${name// /}
              policy=$(apt-cache policy "$name" 2>/dev/null)
              if grep -q 'Candidate: [^(]' <<< "$policy"; then
                chosen=$name
                break
              fi
            done
            if [ -z "$chosen" ]; then
              echo "::error title=System libraries::this distribution has no package of '$entry'"
              exit 1
            fi
            packages+=("$chosen")
          done
          sudo=()
          [ "$(id -u)" -eq 0 ] || sudo=(sudo)
          apt=("${sudo[@]}" env DEBIAN_FRONTEND=noninteractive timeout 600 apt-get -q -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if "${apt[@]}" install --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error title=System libraries::apt-get could not install ${packages[*]}"
          exit 1
      # With the build tools (Nuitka) from the lock's build group.
      - name: Install (locked)
        run: uv sync --frozen --group build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      # Nuitka's compiled C, through ccache: most of it is the dependencies', which change with
      # the lock.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/nuitka-cache-${{ matrix.arch }}
          key: nuitka-linux-${{ matrix.arch }}-${{ hashFiles('uv.lock', 'scripts/build_linux.py') }}
      # Without OPENWEIR_LINUX_UPDATE_KEY: the previews have no update key, so their updater
      # sends people to the release page (docs/release.md).
      - name: Build (unsigned)
        run: |
          export NUITKA_CACHE_DIR="$GITHUB_WORKSPACE/build/nuitka-cache-$ARCH"
          export CCACHE_DIR="$NUITKA_CACHE_DIR/ccache"
          uv run --frozen --group build python scripts/build_linux.py
      - name: Checksums
        working-directory: build/linux-${{ matrix.arch }}
        run: |
          for kind in deb rpm; do
            file="OpenWeir-$VERSION-linux-$ARCH.$kind"
            if [ ! -f "$file" ]; then
              echo "::error title=Linux packages::scripts/build_linux.py wrote no $file"
              exit 1
            fi
            sha256sum "$file" > "$file.sha256"
          done
          ls -l
      # The same tree as the next patch version, which linux-install upgrades to.
      - name: The next version's .deb
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          next="$major.$minor.$((patch + 1))"
          uv run --no-project python scripts/next_version.py --set "$next"
          uv run --frozen --group build python scripts/build_linux.py --packages-only --format deb
          mkdir -p build/linux-upgrade
          mv "build/linux-$ARCH/OpenWeir-$next-linux-$ARCH.deb" build/linux-upgrade/
          uv run --no-project python scripts/next_version.py --set "$VERSION"
      # Kept as long as the disk image, so that a rerun of the preview job still finds them; the
      # preview checks them against their .sha256.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-package-${{ matrix.arch }}-${{ github.sha }}
          path: build/linux-${{ matrix.arch }}/OpenWeir-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-upgrade-${{ matrix.arch }}-${{ github.sha }}
          path: build/linux-upgrade/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      # The DWARF split off openweir-ui and openweir-service, for a preview's crash reports.
      - name: Retain Linux crash symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-symbols-${{ matrix.arch }}-${{ github.sha }}
          path: build/linux-${{ matrix.arch }}/symbols/
          if-no-files-found: error
          retention-days: 30

  # The packages linux-package built, installed, upgraded and removed by
  # package/linux/smoke-test.sh: on Ubuntu 24.04 virtual machines, which systemd runs (the service
  # starts, a SIGKILL's leftovers are cleaned up, an upgrade asks a running UI to quit), and as
  # root in containers without systemd: the oldest distributions the .deb supports, and Fedora
  # for the .rpm. Each failed check is an error annotation that names it.
  linux-install:
    needs: [changes, linux-package]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'linux-install')
    name: linux-install (${{ matrix.mode }}, ${{ matrix.container || matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            mode: system
            container: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            mode: system
            container: ""
          - os: ubuntu-24.04
            arch: x64
            mode: deb
            container: ubuntu:22.04
          - os: ubuntu-24.04
            arch: x64
            mode: deb
            container: debian:12
          - os: ubuntu-24.04-arm
            arch: arm64
            mode: deb
            container: debian:13
          - os: ubuntu-24.04
            arch: x64
            mode: rpm
            container: fedora:41
          - os: ubuntu-24.04-arm
            arch: arm64
            mode: rpm
            container: fedora:41
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: linux-package-${{ matrix.arch }}-${{ github.sha }}
          path: build/install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: matrix.mode == 'system'
        with:
          name: linux-upgrade-${{ matrix.arch }}-${{ github.sha }}
          path: build/upgrade
      - name: Install, upgrade and remove
        env:
          MODE: ${{ matrix.mode }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          case "$MODE" in
          system)
            upgrade=(build/upgrade/OpenWeir-*-linux-"$ARCH".deb)
            bash package/linux/smoke-test.sh system "build/install/OpenWeir-$VERSION-linux-$ARCH.deb" "${upgrade[0]}"
            ;;
          deb) bash package/linux/smoke-test.sh deb "build/install/OpenWeir-$VERSION-linux-$ARCH.deb" ;;
          rpm) bash package/linux/smoke-test.sh rpm "build/install/OpenWeir-$VERSION-linux-$ARCH.rpm" ;;
          esac
      # The journal, apt's or dnf's log and the UI's output.
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-install-${{ matrix.mode }}-${{ matrix.arch }}-${{ strategy.job-index }}-${{ github.sha }}
          path: build/linux-smoke/
          if-no-files-found: ignore
          retention-days: 14

  # The owned-TUN, fd-mode, pinned-TUN and crash tests create a real TUN, so they run only
  # here, inside network namespaces (docs/architecture.md §11). md-tun holds the engine; md-srv,
  # on the far side of a veth pair, serves the page the test fetches through the TUN and echoes
  # the UDP it sends. The servers listen on 10.201.0.1, off md-tun's link: auto-route leaves
  # on-link destinations to the main table, so a server on 10.200.0.0/24 would bypass the TUN.
  tun:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'tun')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: tuntest
            stacks: system,mips
          - tags: tuntest,with_gvisor
            stacks: gvisor,mixed
    defaults:
      run:
        working-directory: src/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Build the TUN test
        run: go test -c -tags "${{ matrix.tags }}" -o "$RUNNER_TEMP/engine-tun.test" ./internal/engine
      - name: Network namespaces
        run: |
          sudo ip netns add md-tun
          sudo ip netns add md-srv
          sudo ip link add md-veth0 type veth peer name md-veth1
          sudo ip link set md-veth0 netns md-tun
          sudo ip link set md-veth1 netns md-srv
          sudo ip -n md-tun addr add 10.200.0.2/24 dev md-veth0
          sudo ip -n md-srv addr add 10.200.0.1/24 dev md-veth1
          sudo ip -n md-srv addr add 10.201.0.1/32 dev lo
          for ns in md-tun md-srv; do sudo ip -n "$ns" link set lo up; done
          sudo ip -n md-tun link set md-veth0 up
          sudo ip -n md-srv link set md-veth1 up
          sudo ip -n md-tun route add default via 10.200.0.1
          # The kernel adds the local route of md-veth0's IPv6 link-local address once
          # duplicate address detection is done, a second or two after the link comes up.
          # The owned-TUN test compares every table before and after, so wait for it here.
          for _ in $(seq 100); do
            sudo ip -n md-tun -6 addr show dev md-veth0 scope link -tentative | grep -q inet6 && break
            sleep 0.1
          done
      - name: Owned TUN in md-tun
        run: |
          resolvectl dns > "$RUNNER_TEMP/dns-before"
          resolvectl domain >> "$RUNNER_TEMP/dns-before"
          mkdir -p "$RUNNER_TEMP/www"
          echo through-tun > "$RUNNER_TEMP/www/index.html"
          # Keep the log runner-owned; only the server needs the namespace's privileges.
          # shellcheck disable=SC2024
          sudo ip netns exec md-srv python3 -m http.server 8080 --bind 10.201.0.1 \
            --directory "$RUNNER_TEMP/www" > "$RUNNER_TEMP/http.log" 2>&1 &
          # shellcheck disable=SC2024
          sudo ip netns exec md-srv python3 -c '
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, 1 << 20)
          s.bind(("10.201.0.1", 8081))
          while True:
              data, peer = s.recvfrom(65535)
              s.sendto(data, peer)
          ' > "$RUNNER_TEMP/udp.log" 2>&1 &
          for _ in $(seq 50); do
            sudo ip netns exec md-tun curl -fsS --max-time 1 http://10.201.0.1:8080/ && break
            sleep 0.2
          done
          sudo env OPENWEIR_TUN_TEST=1 \
            OPENWEIR_TUN_TARGET=http://10.201.0.1:8080/ \
            OPENWEIR_TUN_UDP_TARGET=10.201.0.1:8081 \
            OPENWEIR_TUN_OUTBOUND=md-veth0 \
            OPENWEIR_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^TestOwnedTUN$' -test.v -test.count=1
      # fd mode as the macOS extension runs it: the test creates the TUN and its route, hands
      # the descriptor to the engine, and mihomo's own dials leave through md-veth0.
      - name: fd mode in md-tun
        run: |
          sudo env OPENWEIR_TUN_TEST=1 \
            OPENWEIR_TUN_TARGET=http://10.201.0.1:8080/ \
            OPENWEIR_TUN_UDP_TARGET=10.201.0.1:8081 \
            OPENWEIR_TUN_OUTBOUND=md-veth0 \
            OPENWEIR_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^TestFDTUN$' -test.v -test.count=1
      # The Linux service's TUN on the product's device, table and rules (D67), which a profile
      # cannot move, and the clean-up that systemd runs around the service (tunclean): the crash
      # test kills, then freezes, a child running that TUN and has Clean bring the namespace
      # back. md-srv serves the page over IPv6 as well, on md-veth1's own address: a TUN without
      # an IPv6 address makes IPv6 unreachable under strict-route, whatever the link, and its
      # rules keep doing so after a crash until something removes them. nodad makes the
      # addresses usable at once.
      - name: Pinned TUN and crash clean-up in md-tun
        run: |
          sudo ip -n md-tun addr add fd00:200::2/64 dev md-veth0 nodad
          sudo ip -n md-srv addr add fd00:200::1/64 dev md-veth1 nodad
          # shellcheck disable=SC2024
          sudo ip netns exec md-srv python3 -m http.server 8080 --bind fd00:200::1 \
            --directory "$RUNNER_TEMP/www" > "$RUNNER_TEMP/http6.log" 2>&1 &
          for _ in $(seq 50); do
            sudo ip netns exec md-tun curl -fsS --max-time 1 'http://[fd00:200::1]:8080/' && break
            sleep 0.2
          done
          sudo env OPENWEIR_TUN_TEST=1 \
            OPENWEIR_TUN_TARGET=http://10.201.0.1:8080/ \
            OPENWEIR_TUN_TARGET6='http://[fd00:200::1]:8080/' \
            OPENWEIR_TUN_OUTBOUND=md-veth0 \
            OPENWEIR_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^(TestPinnedTUN|TestCrashedTUN)$' -test.v -test.count=1
      # systemd-resolved serves the runner, outside the namespaces, yet takes interface
      # indexes from inside them over D-Bus: sing-tun's resolvectl calls for mdtun0 land on
      # whichever runner interface has the same index (tunclean's revert skips itself outside
      # PID 1's namespace for that reason). Left there, they cut the runner off its DNS and
      # the job hangs after its last step, so fail here instead.
      - name: Runner DNS untouched
        run: |
          sleep 1
          resolvectl dns > "$RUNNER_TEMP/dns-after"
          resolvectl domain >> "$RUNNER_TEMP/dns-after"
          diff "$RUNNER_TEMP/dns-before" "$RUNNER_TEMP/dns-after"

  result:
    name: CI result
    if: always()
    needs: [changes, python, e2e, go, apple, installer-ui, windows-installer, windows-arm64-upgrade, linux-package, linux-install, tun]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          SELECTED_JOBS: ${{ needs.changes.outputs.jobs }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['CHECK_RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('CI selection failed or was cancelled')
          selected = json.loads(os.environ['SELECTED_JOBS'])
          available = set(results) - {'changes'}
          if not isinstance(selected, list) or any(not isinstance(job, str) or job not in available for job in selected):
              raise SystemExit('Invalid CI selection output')
          failed = {job: info['result'] for job, info in results.items()
                    if info['result'] not in {'success', 'skipped'}
                    or (job in selected and info['result'] != 'success')}
          if failed:
              raise SystemExit(f'CI checks did not succeed: {failed}')
          print('Selected CI checks passed' if selected else 'Documentation-only or empty change: no code checks required')
          PY

  # Publishing runs as part of this workflow, so it uses this commit's workflow files and the
  # installers this run built (a workflow_run trigger would run the default branch's copy).
  preview:
    name: Publish preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [changes, result]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/prerelease.yml
    with:
      version: ${{ needs.changes.outputs.version }}

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, result]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.changes.outputs.version }}
    secrets: inherit

  remove-previews:
    name: Remove released previews
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [result]
    permissions:
      contents: write
    uses: ./.github/workflows/remove-previews.yml
