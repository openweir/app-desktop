# Previews as GitHub pre-releases (docs/release.md "预览版"): the last job of CI (ci.yml) calls
# this on a push to develop once every check has passed, so it runs this commit's copy and
# publishes the installers this CI run built. Its
# unsigned macOS disk image and Windows installers go out as v<version>-preview.<N> (N counts
# from 1 per version), so testers download them from the release page instead of Actions artifacts. main
# holds what is to be released, and its v* tags make the signed releases (release.yml). Pre-releases
# are never offered as updates (src/openweir/update/releases.py reads releases/latest only), and
# only the newest is kept, so a preview carries all three installers: a develop push that builds
# one builds them all (scripts/ci_changes.py), and a run without each of them publishes nothing
# and leaves the previous preview in place. A CI run that built no installer (documentation
# only) publishes nothing either.
name: Preview

on:
  workflow_call:
    inputs:
      version:
        description: The version CI computed (scripts/next_version.py)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    # A newer develop commit supersedes the preview being published.
    concurrency:
      group: prerelease
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      # CI keeps the installers for a week (ci.yml), long enough for a rerun of this job. When
      # nothing matches, nothing is downloaded and dist is not created.
      - name: Installers from the CI run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: "{macos-universal,windows-installer}-*"
          merge-multiple: true
          path: dist

      - name: Name the files after the preview version
        id: files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          # CI's changes job computed it from git (scripts/next_version.py).
          version="$VERSION"
          skip() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)" != "$HEAD_SHA" ]; then
            skip "A later develop commit has superseded this CI run."
          fi
          # develop at a released commit (main merged back) has nothing new to preview.
          released=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '(.isDraft or .isPrerelease) | not' 2>/dev/null || true)
          if [ "$released" = true ]; then
            skip "v$version is already released; no preview."
          fi
          mkdir -p dist
          cd dist
          dmgs=(*.dmg)
          x64=(OpenWeir-*-windows-x64-setup.exe)
          arm64=(OpenWeir-*-windows-arm64-setup.exe)
          if [ $((${#dmgs[@]} + ${#x64[@]} + ${#arm64[@]})) -eq 0 ]; then
            skip "This CI run built no installer; nothing to publish."
          fi
          # The new preview replaces the previous one, so it carries every platform or is not made.
          if [ ${#dmgs[@]} -ne 1 ] || [ ${#x64[@]} -ne 1 ] || [ ${#arm64[@]} -ne 1 ]; then
            echo "::warning::Found ${#dmgs[@]} disk image(s), ${#x64[@]} x64 and ${#arm64[@]} ARM64 installer(s), not one of each; the previous preview stays"
            skip "Not one of each installer; no preview, and the previous one stays."
          fi
          # Previews of a version count from 1: the next number after this version's newest preview.
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v$version-preview.\")) | ltrimstr(\"v$version-preview.\") | select(test(\"^[0-9]+\$\")) | tonumber] | max // 0")
          preview="$version-preview.$((last + 1))"
          mv "${dmgs[0]}" "OpenWeir-$preview-macos-universal-unsigned.dmg"
          mv "${x64[0]}" "OpenWeir-$preview-windows-x64-unsigned-setup.exe"
          mv "${arm64[0]}" "OpenWeir-$preview-windows-arm64-unsigned-setup.exe"
          files=(OpenWeir-*)
          sha256sum "${files[@]}" > SHA256SUMS
          ls -l
          echo "tag=v$preview" >> "$GITHUB_OUTPUT"
          echo "version=$preview" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish the pre-release
        if: steps.files.outputs.publish == 'true'
        env:
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Preview of OpenWeir $VERSION, built from ${HEAD_SHA:0:7} on develop.

          - **Previews are unsigned**; only stable releases published from main are signed and notarized. On Windows, SmartScreen warns about an unknown publisher: choose **More info → Run anyway**.
          - **On macOS you can look around but not connect**: the system extension needs a Developer ID signature and notarization before it can be activated.
          - In-app updates never offer previews; switch to the stable release once it is out.
          - Verify the downloads with \`SHA256SUMS\`.

          ---

          OpenWeir $VERSION 预览版，由 develop 上的 ${HEAD_SHA:0:7} 构建。

          - **预览版不签名**，只有 main 上发布的正式版才签名和公证。Windows 安装时 SmartScreen 会提示未知发布者，选择「更多信息 → 仍要运行」。
          - **macOS 只能查看界面，不能连接**：系统扩展需要 Developer ID 签名和公证才能激活。
          - 预览版不会通过应用内更新推送；正式版发布后请改用正式版。
          - 用 \`SHA256SUMS\` 核对下载的文件。
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --prerelease

      # Only the newest preview stays; the older ones go, with their tags.
      - name: Remove older previews
        if: steps.files.outputs.publish == 'true'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.+-preview\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

      # develop's CI runs cancelled by a newer push only clutter the Actions list. Only those:
      # a cancelled run of another branch or workflow may be one someone wants to look at.
      - name: Delete cancelled runs
        if: always()
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch develop --status cancelled \
            --limit 100 --json databaseId --jq '.[].databaseId' |
          while read -r id; do
            gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
