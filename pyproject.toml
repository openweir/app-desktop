[project]
name = "openweir"
version = "0.1.0"
description = "OpenWeir, a mihomo desktop client for Windows and macOS (PySide6 / QML)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Ember Moth", email = "ember_moth@proton.me" }
]
requires-python = ">=3.14.7"
dependencies = [
    "httpx>=0.28.1,<1",
    "keyring>=25.7.0",
    "protobuf==6.33.4",
    "pyside6>=6.11.2",
]

[project.scripts]
openweir = "openweir.bootstrap:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openweir"
module-root = "src"

[dependency-groups]
dev = [
    "packaging>=26.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]
# The installer builds' tools, at the exact versions the build scripts check (NUITKA_VERSION in
# scripts/build_app.py and package/windows/nuitka_pefile.py, DMGBUILD_VERSION in
# scripts/build_dmg.py): uv run --group build python scripts/build_app.py, and so on.
build = [
    "nuitka==4.2.2",
    "dmgbuild==1.6.7; sys_platform == 'darwin'",
]

[tool.ruff]
extend-exclude = ["src/openweir/protocol/*_pb2.py", "src/openweir/protocol/*_pb2.pyi"]
target-version = "py314"
line-length = 100
src = ["src", "tests", "package", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PT",       # pytest style
]

[tool.ruff.lint.isort]
known-first-party = ["openweir", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Qt-facing API on ViewModels (slots, signals, properties) is camelCase to match QML;
# their Chinese UI copy uses fullwidth punctuation.
"src/openweir/viewmodels/**" = ["N802", "N815", "RUF001"]
# Sample tables read better one row per line.
"tests/support/simulated.py" = ["E501"]
# Nuitka reads each `# nuitka-project:` option from a single comment line.
"package/entry.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
exclude = ["src/openweir/protocol/*_pb2.py"]
include = ["src", "tests", "package", "scripts"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = [
    "e2e: runs the UI against the development service; needs OPENWEIR_E2E=1 (tests/e2e)",
]
